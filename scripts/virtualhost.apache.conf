<VirtualHost *:80>
  ServerAdmin webmaster@emilie.local
  ServerName emilie.local
  ServerAlias www.emilie.local
  DocumentRoot /var/www/emilie/public

  <Directory /var/www/emilie/public>
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/emilie_error.log
  CustomLog ${APACHE_LOG_DIR}/emilie_access.log combined
</VirtualHost>
